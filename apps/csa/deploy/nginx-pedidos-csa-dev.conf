# Ambiente de DEV da CSA — mesma VM e mesmo certificado da produção, isolado por PORTA.
# Padrão já usado na VM pelo nativa-dev (8190) e pelo Fermentou (8092): sem DNS, sem certbot.
#
# Instalar:
#   sudo cp deploy/nginx-pedidos-csa-dev.conf /etc/nginx/sites-available/pedidos-csa-dev
#   sudo ln -sf /etc/nginx/sites-available/pedidos-csa-dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# A porta 8193 precisa estar aberta na Security List da Oracle (é o passo que NÃO é feito aqui
# e sem o qual a página simplesmente não carrega, sem erro nenhum no nginx).
server {
    listen 8193 ssl;
    server_name csaparahyba.com.br www.csaparahyba.com.br;

    ssl_certificate     /etc/letsencrypt/live/csaparahyba.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csaparahyba.com.br/privkey.pem;

    # Deixa explícito na aba do navegador que NÃO é produção — os dois têm o mesmo domínio e a
    # mesma cara, e a única diferença visível seria a porta na barra de endereço.
    add_header X-Ambiente "dev" always;

    root /opt/pedidos-csa-dev/dist;
    index index.html;

    # SPA: rota de front resolve no index, senão F5 em /acolhida dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
