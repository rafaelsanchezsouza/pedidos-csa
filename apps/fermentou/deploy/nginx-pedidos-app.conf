# pedidos-app — mesmo domínio da VM (csaparahyba.com.br), porta dedicada 8092.
# Acesso: https://csaparahyba.com.br:8092
# TLS reutiliza o certificado Let's Encrypt já emitido pro pedidos-csa
# (confirme o path: sudo ls /etc/letsencrypt/live/).
# Auth: LOGIN NO APP (email/senha do admin; código por WhatsApp é opcional) — a API
# exige token; o SPA é público, então não há basic auth do nginx.
# Copiar para /etc/nginx/sites-available/pedidos-app e habilitar em sites-enabled.
#
# NÃO usar o setup-vm.sh para este app: ele assume `listen 80`, que já é do
# pedidos-csa. Este conf é o caminho correto na VM compartilhada (padrão note-app).
#
# Depois de habilitar:
#   sudo iptables -I INPUT -p tcp --dport 8092 -j ACCEPT && sudo netfilter-persistent save
#   Oracle Cloud Console → VCN → Security Lists → Ingress TCP 8092 0.0.0.0/0
server {
    listen 8092 ssl;
    server_name csaparahyba.com.br www.csaparahyba.com.br;

    ssl_certificate     /etc/letsencrypt/live/csaparahyba.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csaparahyba.com.br/privkey.pem;

    # Headers de segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (SPA)
    root /opt/pedidos-app/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend
    location /api/ {
        proxy_pass http://localhost:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
